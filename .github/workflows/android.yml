name: Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Kutubxonalarni o'rnatish
        run: npm install --no-audit --no-fund

      - name: Frontend'ni yig'ish
        run: npm run build

      - name: Android loyihasini yaratish
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' $M

      - name: Ilova ikonkalari
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#111827' --iconBackgroundColorDark '#111827' --splashBackgroundColor '#111827' --splashBackgroundColorDark '#111827' || echo "ikonka o'tkazib yuborildi"

      - name: APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../tovuq-crm.apk

      - name: APK'ni saqlash (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: tovuq-crm-apk
          path: tovuq-crm.apk

      - name: Release "latest" ni yangilash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tovuq CRM — oxirgi APK
          body: "Planshetga o'rnatish uchun tovuq-crm.apk faylini yuklab oling."
          files: tovuq-crm.apk
          prerelease: false
